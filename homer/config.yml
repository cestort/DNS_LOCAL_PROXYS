title: "Portal de conocimiento del Centro de Operaciones del Entorno de la Información"
subtitle: "Servicios de la red .local"
logo: "assets/logo-coei.svg"
theme: default
colored: true
columns: "3"
showDescription: true
stylesheet:
  - "assets/custom.css"
footer: false

defaults:
  colorTheme: dark

colors:
  dark:
    highlight-primary: "#4d689c"
    highlight-secondary: "#5573ab"
    highlight-hover: "#6f89c2"
    background: "#0a0e16"
    card-background: "#121a29"
    text: "#c7cddb"
    text-header: "#eef1f6"
    text-title: "#eef1f6"
    text-subtitle: "#8993a8"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#e3ab3d"
    link-hover: "#f0bc55"
  light:
    highlight-primary: "#2e416a"
    highlight-secondary: "#243657"
    highlight-hover: "#3a4f80"
    background: "#f3f1eb"
    card-background: "#ffffff"
    text: "#33291a"
    text-header: "#f4f1e9"
    text-title: "#2e416a"
    text-subtitle: "#6b5f4d"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#8a611f"
    link-hover: "#6f4c17"

services:
  - name: "Administración"
    icon: "fas fa-cogs"
    items:
      - name: "Pi-hole"
        subtitle: "DNS de la LAN y bloqueo de anuncios"
        tag: "ops"
        url: "http://192.168.5.112:8080/admin"
        icon: "fas fa-shield-halved"
        target: "_blank"
      - name: "Nginx Proxy Manager"
        subtitle: "Reverse proxy · panel de hosts"
        tag: "ops"
        url: "http://192.168.5.112:81"
        icon: "fas fa-network-wired"
        target: "_blank"

  - name: "APIs de IA"
    icon: "fas fa-brain"
    items:
      - name: "Traductor NLLB"
        subtitle: "Traducción multilingüe · prueba interactiva"
        tag: "api"
        url: "http://192.168.5.54:8002/ui"
        icon: "fas fa-language"
        target: "_blank"
      - name: "Extractor de Entidades"
        subtitle: "Personas, organizaciones y lugares · prueba interactiva"
        tag: "api"
        url: "http://192.168.5.54:5000/ui"
        icon: "fas fa-magnifying-glass"
        target: "_blank"
      - name: "Transcriptor Whisper"
        subtitle: "Transcripción de audio y vídeo · prueba interactiva"
        tag: "api"
        url: "http://192.168.5.54:8001/ui"
        icon: "fas fa-microphone"
        target: "_blank"
